name: Kiuwan

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    uses: TransbankDevelopers/transbank-github-actions-templates/.github/workflows/kiuwan-pr-scan.yml@80df7f0a80353edec0d6617a8881ce9c09076a6a
    with:
      project_name: td-webpay-sdk-php
      source_path: .
      fail_on_audit: true
    secrets:
      VPN_CONFIG_B64: ${{ secrets.VPN_CONFIG_B64 }}
      VPN_USER: ${{ secrets.VPN_USER }}
      VPN_PASS: ${{ secrets.VPN_PASS }}
      KIUWAN_USER: ${{ secrets.KIUWAN_USER }}
      KIUWAN_PASS: ${{ secrets.KIUWAN_PASS }}
